<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Toggle Show Hide</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      .hidden {
        display: none;
      }

      button {
        padding: 8px 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Toggle Show / Hide Demo</h2>

    <button id="toggleBtn">Show / Hide Text</button>

    <p id="text">This text can be shown or hidden using JavaScript DOM.</p>

    <script>
      const button = document.getElementById("toggleBtn");
      const text = document.getElementById("text");

      button.addEventListener("click", () => {
        text.classList.toggle("hidden");
        console.log(text);
      });
    </script>
  </body>
</html>
